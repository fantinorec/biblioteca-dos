<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario - Biblioteca</title>
    <link rel="stylesheet" href="/Biblioteca_dos/frontend/css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 id="nombre">Lector</h2>
                <p id="email" style="font-size: 0.85rem; color: #94a3b8;"></p>
            </div>
            <nav class="sidebar-menu">
                <button class="menu-btn active" data-target="modulo-catalogo">📖 Catálogo de Libros</button>
                <button class="menu-btn" data-target="modulo-prestamos">⏳ Mis Préstamos</button>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">🚪 Salir</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Biblioteca Digital</h1>
                
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="filtro_categoria" style="padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </header>

            <div class="content-body">
                
                <section id="modulo-catalogo" class="crud-section">
                    <h3 style="margin-bottom: 20px;">Libros Disponibles</h3>
                    
                    <div id="grid-libros" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
                        <div class="form-card" style="text-align: center;">Cargando catálogo...</div>
                    </div>
                </section>

                <section id="modulo-prestamos" class="crud-section hidden">
                    <div class="list-card">
                        <h3>Historial de Solicitudes</h3>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Libro</th>
                                        <th>Fecha Solicitud</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-prestamos">
                                    <tr>
                                        <td colspan="3" style="text-align: center; color: #64748b;">No tenés préstamos activos todavía.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script>
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.crud-section').forEach(s => s.classList.add('hidden'));
                
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.remove('hidden');
            });
        });
    </script>

    <script src="/Biblioteca_dos/js/app.js"></script>
    <script src="/Biblioteca_dos/js/usuario.js"></script>

</body>
</html>
