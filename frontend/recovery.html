<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="login-container">
            <h1>Recuperar Contraseña</h1>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px; text-align: center;">
                Ingresá tu correo electrónico y te enviaremos un enlace para cambiar tu clave.
            </p>

            <form id="formRecovery">
                <input type="email" id="emailRecovery" placeholder="Correo electrónico" required>
                <button type="submit">Enviar Enlace</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="login.html">Volver al Login</a>
            </div>
        </div>
    </div>

    <script src="../js/recovery.js"></script>
</body>
</html>
